services:
  backup-center-db:
    image: postgres:16
    environment:
      POSTGRES_USER: weps
      POSTGRES_PASSWORD: weps
      POSTGRES_DB: weps_backup_center
    ports:
      - "5433:5432"
    volumes:
      - backup_center_data:/var/lib/postgresql/data

  source-db:
    image: postgres:16
    environment:
      POSTGRES_USER: source
      POSTGRES_PASSWORD: source
      POSTGRES_DB: source_app
    ports:
      - "5434:5432"
    volumes:
      - source_data:/var/lib/postgresql/data
      - ./docker/dev/source-init.sql:/docker-entrypoint-initdb.d/01-sample.sql:ro

volumes:
  backup_center_data:
  source_data:
